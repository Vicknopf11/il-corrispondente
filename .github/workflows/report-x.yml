name: Report X settimanale

# Legge le visualizzazioni degli ultimi 7 giorni dei post dell'account e le
# incrocia con categoria e link. Non scrive nel repo e non pubblica niente:
# il riepilogo compare nel Summary della run. Costo massimo: circa 30 centesimi
# per lancio (lettura a pagamento per post).

on:
  workflow_dispatch:                  # lancio manuale da Actions → Run workflow
  repository_dispatch:
    types: [report-x]                 # opzionale: job settimanale su cron-job.org

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: pip install requests requests-oauthlib

      - name: Report delle visualizzazioni
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python report_x_settimanale.py
