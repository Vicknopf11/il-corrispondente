name: Rassegna Sportiva (fonti gratuite)

# Indipendente dalla pipeline satirica (genera-post.yml): niente
# ANTHROPIC_API_KEY, niente pubblicazione su X. Solo raccolta da fonti
# gratuite (RSS + TheSportsDB) e aggiornamento del sito.
on:
  repository_dispatch:
    types: [aggiorna-sport]   # trigger esterno via cron-job.org, 3 job separati su cron-job.org
                              # (uno per orario) che inviano lo stesso event_type
  workflow_dispatch:         # consente esecuzione manuale

jobs:
  raccogli:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Raccogli rassegna sportiva da fonti gratuite
        env:
          THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
        run: python raccogli_sport.py

      - name: Commit e push
        run: |
          git config user.name "Il Corrispondente Bot"
          git config user.email "bot@il-corrispondente"
          git add docs/rassegna_sport.json docs/copertura_sport.json
          git diff --staged --quiet || git commit -m "Rassegna sportiva: aggiornamento $(date +'%Y-%m-%d %H:%M')"
          git push
